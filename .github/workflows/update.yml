name: Update Lotto Data

on:
  # 매주 토요일 22:00 KST (= 13:00 UTC) — 추첨 1시간 후 시도
  schedule:
    - cron: '0 13 * * 6'
  # 수동 트리거: GitHub UI > Actions > Run workflow
  workflow_dispatch:
    inputs:
      round:
        description: '회차 번호 (예: 1209)'
        required: false
      date:
        description: '추첨일 YYYY-MM-DD (예: 2026-05-02)'
        required: false
      numbers:
        description: '당첨 번호 6개 쉼표 구분 (예: 3,12,18,23,31,42)'
        required: false
      bonus:
        description: '보너스 번호 (예: 7)'
        required: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run update script
        env:
          MANUAL_ROUND: ${{ github.event.inputs.round }}
          MANUAL_DATE: ${{ github.event.inputs.date }}
          MANUAL_NUMBERS: ${{ github.event.inputs.numbers }}
          MANUAL_BONUS: ${{ github.event.inputs.bonus }}
        run: node scripts/update.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "data: update lotto rounds [skip ci]"
            git push
          fi
